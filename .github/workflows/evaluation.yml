name: Evaluation integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/generate_dataset.py
      - run: python scripts/upgrade_workflow_v2.py
      - run: python -m unittest discover -s tests -v
      - name: Re-evaluate preserved V1 baseline
        run: python scripts/generate_xlsx_output.py
      - name: Re-evaluate committed V2 outputs against source ledger
        run: >-
          python scripts/generate_xlsx_output.py
          --outputs-dir outputs/v2
          --answer-key fixtures/v2/answer_key.json.gz
          --accrual-csv fixtures/v2/invoice_accruals.csv
          --xlsx outputs/v2/deduction_resolution_workbench_v2.xlsx
          --metrics-json outputs/v2/evaluation_metrics.json
      - run: git diff --exit-code -- fixtures/v2 workflows/DEDUCTION_RESOLUTION_WORKBENCH_V2.json
